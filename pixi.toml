[workspace]
authors = ["Mr-Leshiy <leshiy12345678@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max-nightly"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]
version = "0.1.0"
license = "MIT OR Apache-2.0"
preview = ["pixi-build"]

[workspace.dependencies]
mojo = "*"
max = "*"
warp = { git = "https://github.com/Mr-Leshiy/warp.git", branch = "main" }

[package]
name = "mojo-crypto"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.2.7.*" }

[package.host-dependencies]
mojo.workspace = true
max.workspace = true
warp.workspace = true

[package.build-dependencies]
mojo.workspace = true
max.workspace = true
warp.workspace = true

[package.run-dependencies]
mojo.workspace = true
warp.workspace = true

[tasks]
fmt    = "mojo format ."

# $MOJO_TEST_FEATURES enables the crypto instructions used by the hardware
# backends, so the tests exercise the native backend of the target. CI sets it
# per-runner (see .github/workflows/ci.yml); set it yourself to test a specific
# backend locally, e.g.
#   MOJO_TEST_FEATURES=--target-features=+neon,+aes,+sha2,+sha3 pixi run test
# Unset, the tests build for whatever `mojo build` autodetects on the host. The
# runner loop lives in a script because pixi's cross-platform task shell has no
# loops.
test   = "python scripts/test.py"

# The ACVP server the tests in tests/acvp request their vectors from (see
# tests/acvp/README.md). Needs Docker with the compose plugin; the first
# `acvp-up` builds NIST's ACVP Gen/Vals image, which takes a few minutes.
acvp-up   = "docker compose -f tests/acvp/server/docker-compose.yml up --detach --wait --build"
acvp-down = "docker compose -f tests/acvp/server/docker-compose.yml down"

# Compile-only checks for the benchmarks, across both environments.
bench-build = { depends-on = [
    { task = "bench-build-mojo", environment = "bench" },
    { task = "bench-build-rust", environment = "rust" },
] }

[dependencies]
mojo.workspace = true
max.workspace = true
warp.workspace = true
mojo-crypto = { path = "." }

# Tooling that isn't needed to build and test lives in separate features and
# environments, so nothing else can clobber the Mojo toolchain

# Docs-only tooling.
[feature.docs.tasks]
# Build the API documentation site into docs/site/public:
#   1. modo runs `mojo doc`, copies each package README.md in as an Overview
#      page, and emits Hugo content (see modo.yaml). Invoked as `python -m
#      pymodo` (the documented fallback) so it works without depending on the
#      `modo` console script being exposed on PATH.
#   2. `hugo` renders the static HTML site (theme fetched via Hugo Modules).
docs = "python -m pymodo build && hugo --source docs/site"

[feature.docs.dependencies]
hugo = ">=0.163.3,<0.164"
go = ">=1.26.4,<2"

[feature.docs.pypi-dependencies]
pymodo = ">=0.11.13, <0.12"

# Mojo benchmarks (running them requires a GPU / specific host CPU).
[feature.bench.tasks]
bench = "python -m benchmarks.cli"

# Compile-only check: verify the benchmarks build without running them.
bench-build-mojo = "python scripts/bench_build_mojo.py"

[feature.bench.pypi-dependencies]
typer = ">=0.12"

# Rust reference benchmarks.
[feature.rust.tasks]
bench-rust = "cargo bench --manifest-path benchmarks/rust/Cargo.toml"
bench-build-rust = "cargo bench --no-run --manifest-path benchmarks/rust/Cargo.toml"

[feature.rust.dependencies]
rust = ">=1.80.0,<2"

[environments]
docs = ["docs"]
bench = ["bench"]
# `no-default-feature = true` leaves out the root `[dependencies]` (mojo, max,
# warp), which every other environment inherits, so rust never shares an
# environment with mojo-compiler.
rust = { features = ["rust"], no-default-feature = true }
