[workspace]
authors = ["Mr-Leshiy <leshiy12345678@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]
version = "0.1.0"
license = "MIT OR Apache-2.0"
preview = ["pixi-build"]

[workspace.dependencies]
mojo = "1.0.0.*"
max = "26.5.0.*"

[package]
name = "mojo-crypto"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.host-dependencies]
mojo.workspace = true
max.workspace = true

[package.build-dependencies]
mojo.workspace = true
max.workspace = true

[package.run-dependencies]
mojo.workspace = true

[tasks]
fmt    = "mojo format ."

# Build the API documentation site into docs/site/public:
#   1. modo runs `mojo doc`, copies each package README.md in as an Overview
#      page, and emits Hugo content (see modo.yaml). Invoked as `python -m
#      pymodo` (the documented fallback) so it works without depending on the
#      `modo` console script being exposed on PATH.
#   2. `hugo` renders the static HTML site (theme fetched via Hugo Modules).
docs = "python -m pymodo build && hugo --source docs/site"

# $MOJO_TEST_FEATURES enables the crypto instructions used by the hardware
# backends, so the tests exercise the native backend of the target. CI sets it
# per-runner (see .github/workflows/ci.yml); set it yourself to test a specific
# backend locally, e.g.
#   MOJO_TEST_FEATURES=--target-features=+neon,+aes,+sha2,+sha3 pixi run test
# Unset, the tests build for whatever `mojo run` autodetects on the host. The
# runner loop lives in a script because pixi's cross-platform task shell has no
# loops.
test   = "python scripts/test.py"

bench  = "python -m benchmarks.cli"
bench-rust = "cargo bench --manifest-path benchmarks/rust/Cargo.toml"

# Compile-only checks for the benchmarks: verify they build without running them
# (running requires a GPU / specific host CPU).
bench-build = { depends-on = ["bench-build-mojo", "bench-build-rust"] }

bench-build-mojo = "python scripts/bench_build_mojo.py"

bench-build-rust = "cargo bench --no-run --manifest-path benchmarks/rust/Cargo.toml"

[dependencies]
mojo.workspace = true
max.workspace = true
rust = ">=1.80.0,<2"
hugo = ">=0.163.3,<0.164"
go = ">=1.26.4,<2"
gpu_async = { git = "https://github.com/Mr-Leshiy/mojo-gpu-async", branch = "feat/install-section" }

[pypi-dependencies]
typer = ">=0.12"
pymodo = ">=0.11.13, <0.12"
